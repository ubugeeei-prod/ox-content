name: Deploy docs to Void

on:
  push:
    branches: [main]
  workflow_dispatch:

# Latest push wins for the Void deployment. The GitHub Pages workflow remains
# separate in deploy.yml.
concurrency:
  group: void-deploy-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

# `void deploy --platform cloudflare` uploads straight to our Cloudflare account,
# so the job only needs read access to the repository. The API token needs
# Workers Scripts: Edit on the account in CLOUDFLARE_ACCOUNT_ID.
permissions:
  contents: read

env:
  OX_CONTENT_DOCS_BASE: /
  OX_CONTENT_DOCS_SITE_URL: ${{ vars.OX_CONTENT_DOCS_SITE_URL || 'https://ox-content.void.app' }}

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: blacksmith-32vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@24d870228786dc83ae73482406bdd1e7befaec14 # v1.21.0
        with:
          cache: true
          run-install: true

      - name: Mount sticky cache
        uses: ./.github/actions/mount-sticky-cache
        with:
          key-prefix: ${{ github.repository }}-void-deploy-${{ github.job }}
          cargo: "true"
          target: target
          browsers: "true"

      - name: Install browsers for docs rendering
        run: |
          vp exec --filter @ox-content/vite-plugin -- playwright install chromium
          vp exec --filter @ox-content/vite-plugin -- puppeteer browsers install chrome-headless-shell

      - name: Deploy docs to Void
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node tools/scripts/deploy-docs-to-void.mjs
