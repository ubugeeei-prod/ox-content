name: Nightly Rust experiments

# Opt-in rustc experiment lanes. This workflow is not a required check.
# Stable CI (.github/workflows/ci.yml) remains the release gate.
#
# NIGHTLY_TOOLCHAIN is a dated pin so a red run is attributable to one
# compiler. To bump it: change the env value below and dispatch this
# workflow from the Actions tab.
# Flag names are not hardcoded blindly — each lane probes rustc's help
# output (`rustc -Z help` for -Z flags, `rustc -Zunstable-options --help -v`
# for unstable CLI options) and validates the preferred value, then fails
# with rustc's accepted-values list if the name moved.

on:
  workflow_dispatch:
  schedule:
    # Daily 07:00 UTC, after typical nightly toolchain publish.
    - cron: "0 7 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Dated pin so failures are diagnosable. Bump this when refreshing the
  # experiment snapshot.
  NIGHTLY_TOOLCHAIN: nightly-2026-11-16

jobs:
  experiment:
    name: ${{ matrix.lane.name }}
    runs-on: blacksmith-32vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        lane:
          # Polonius Alpha is the nightly default as of nightly-2026-08-06
          # (`-Zpolonius=off` vs `-Zpolonius=next`). Pass `next` explicitly
          # and log rustc + flags even when it is already the default.
          - name: Polonius Alpha
            id: polonius
            kind: z
            flag: polonius
            preferred: next
          # Next-gen trait solver is the nightly default as of ~2026-08-21.
          # `-Znext-solver=globally` is the current enable-everywhere value;
          # disable is `-Znext-solver=coherence`. Probe before using it.
          - name: Next-gen trait solver
            id: next-solver
            kind: z
            flag: next-solver
            preferred: globally
          # The parallel frontend is the nightly default as of
          # nightly-2026-11-14, with 2 threads (so the other lanes run it too).
          # It is tuned with the unstable CLI option `--jobs-frontend=N`
          # (`-Zthreads` is deprecated in its favour). This lane uses 16: on a
          # 15-core Mac, 12 and 16 were the fastest settings for
          # ox_content_transform (about -50% vs 1 thread; 8 was about -42%),
          # and 16 is half this runner's vCPUs. It also pushes well past the
          # default to shake out ICEs, deadlocks and nondeterminism.
          # https://blog.rust-lang.org/2026/11/16/enabling-parallel-frontend-on-nightly/
          # Report crashes at https://github.com/rust-lang/rust/issues/113349
          - name: Parallel frontend (16 threads)
            id: parallel-frontend
            kind: option
            flag: jobs-frontend
            preferred: "16"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: ${{ env.NIGHTLY_TOOLCHAIN }}

      - name: Mount sticky cache
        uses: ./.github/actions/mount-sticky-cache
        with:
          key-prefix: ${{ github.repository }}-nightly-rust-experiments-${{ matrix.lane.id }}
          cargo: "true"
          target: target

      - name: Record rustc and resolve experiment flags
        env:
          EXPERIMENT_KIND: ${{ matrix.lane.kind }}
          EXPERIMENT_FLAG: ${{ matrix.lane.flag }}
          PREFERRED_VALUE: ${{ matrix.lane.preferred }}
        run: |
          set -euo pipefail

          # rust-toolchain.toml pins stable and outranks the rustup default the
          # setup step installs, so select the nightly explicitly for this and
          # every later step.
          export RUSTUP_TOOLCHAIN="${NIGHTLY_TOOLCHAIN}"
          echo "RUSTUP_TOOLCHAIN=${NIGHTLY_TOOLCHAIN}" >> "$GITHUB_ENV"

          echo "=== pinned toolchain ==="
          echo "NIGHTLY_TOOLCHAIN=${NIGHTLY_TOOLCHAIN}"
          echo "EXPERIMENT_KIND=${EXPERIMENT_KIND}"
          echo "EXPERIMENT_FLAG=${EXPERIMENT_FLAG}"
          echo "PREFERRED_VALUE=${PREFERRED_VALUE}"

          echo "=== rustc -vV ==="
          rustc -vV

          case "${EXPERIMENT_KIND}" in
            z)
              help_cmd=(rustc -Z help)
              help_pattern="[[:space:]]${EXPERIMENT_FLAG}(=|[[:space:]])"
              experiment_flags="-Z${EXPERIMENT_FLAG}=${PREFERRED_VALUE}"
              ;;
            option)
              help_cmd=(rustc -Zunstable-options --help -v)
              help_pattern="[[:space:]]--${EXPERIMENT_FLAG}([=[:space:]]|$)"
              experiment_flags="-Zunstable-options --${EXPERIMENT_FLAG}=${PREFERRED_VALUE}"
              ;;
            *)
              echo "::error::Unknown experiment kind '${EXPERIMENT_KIND}' (expected z or option)."
              exit 1
              ;;
          esac

          echo "=== ${help_cmd[*]} (experiment flag) ==="
          help_out="$("${help_cmd[@]}" 2>&1)" || true
          if ! printf '%s\n' "$help_out" | grep -E "$help_pattern"; then
            echo "::error::${help_cmd[*]} on ${NIGHTLY_TOOLCHAIN} does not list '${EXPERIMENT_FLAG}'."
            echo "Bump NIGHTLY_TOOLCHAIN or update the experiment flag name. Full help:"
            printf '%s\n' "$help_out"
            exit 1
          fi

          # Compile an empty crate rather than running `rustc -vV`: some
          # options (e.g. --jobs-frontend) only parse their value when a
          # session starts. An invalid value prints the accepted list.
          echo "=== validating ${experiment_flags} ==="
          probe_dir="$(mktemp -d)"
          echo 'fn main() {}' > "${probe_dir}/probe.rs"
          # shellcheck disable=SC2086 # experiment_flags is a flag list
          if ! rustc ${experiment_flags} --emit=metadata \
            --out-dir "${probe_dir}" "${probe_dir}/probe.rs" \
            >/tmp/rustc-flag.out 2>/tmp/rustc-flag.err; then
            echo "::error::${experiment_flags} is not accepted on ${NIGHTLY_TOOLCHAIN}."
            echo "Update the lane preferred value from rustc's accepted-values list:"
            cat /tmp/rustc-flag.err
            exit 1
          fi

          echo "RUSTFLAGS=${experiment_flags}" >> "$GITHUB_ENV"

          echo "=== experiment flags ==="
          echo "RUSTFLAGS=${experiment_flags}"

      - name: cargo check --workspace --all-targets
        run: cargo check --workspace --all-targets
