name: Release recovery

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to recover, for example v3.0.0-alpha.17"
        required: true
        type: string

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  publish-missing-npm:
    name: Publish missing npm artifacts
    # npm verifies the provenance bundle against the runner environment and
    # rejects anything minted outside a GitHub-hosted runner. Blacksmith hosts
    # register as "self-hosted", so every provenance publish in this job fails
    # with a 422. Keep this job on the GitHub-hosted tier; the build jobs and
    # the crates.io publish are free to stay on Blacksmith.
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@313600b80b104eadebb9111787d37a2e83e014ca # v1.17.0
        with:
          node-version-file: ".node-version"
          cache: true
          run-install: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: wasm32-unknown-unknown

      - name: Setup npm registry
        run: npm config set registry https://registry.npmjs.org

      # Same trusted-publishing path as publish.yml: npm detects the Actions
      # OIDC token and exchanges it for a short-lived publish credential, and
      # generates provenance on that path. No long-lived token takes part in
      # publishing anywhere in this repository.
      - name: Install npm with trusted publishing support
        run: npm install -g npm@11.19.0 # zizmor: ignore[adhoc-packages]

      - name: Determine npm tag
        env:
          RECOVERY_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${RECOVERY_TAG#v}"
          if [[ "$VERSION" == *"-"* ]]; then
            PRE_ID="${VERSION#*-}"
            TAG="${PRE_ID%%.*}"
          else
            TAG="latest"
          fi

          if [[ ! "$TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            echo "::error::Invalid npm dist-tag: $TAG"
            exit 1
          fi

          echo "NPM_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Build material theme package
        run: vp exec --filter @ox-content/theme-color-material -- vp pack

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: Build WASM package
        run: vp run build:wasm

      # A package name that has never been published cannot be recovered here:
      # trusted publishing has no package to attach a publisher to, so npm
      # rejects the OIDC exchange. Bootstrapping a new name is a one-time human
      # publish followed by `npm trust github <pkg> --file publish.yml
      # --repo <owner/repo> --env npm`, after which every release is OIDC again.
      - name: Publish missing npm packages
        run: |
          set -euo pipefail

          publish_dir() {
            local dir="$1"
            local pkg_name pkg_version tarball

            pkg_name=$(node -p "require('./${dir}/package.json').name")
            pkg_version=$(node -p "require('./${dir}/package.json').version")

            if npm view "${pkg_name}@${pkg_version}" version >/dev/null 2>&1; then
              echo "Skipping ${pkg_name}@${pkg_version} (already published)"
              return 0
            fi

            tarball=$(cd "$dir" && vp exec -- pnpm pack --pack-destination "$RUNNER_TEMP" | tail -1)
            if [[ "$tarball" != /* ]]; then
              tarball="$RUNNER_TEMP/$tarball"
            fi
            npm publish "$tarball" --provenance --access public --tag "$NPM_TAG"
          }

          publish_dir npm/theme-color/material
          publish_dir crates/ox_content_wasm/pkg

  create-release:
    name: Create GitHub Release
    runs-on: blacksmith-32vcpu-ubuntu-2404
    needs: publish-missing-npm
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REF_NAME: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$GH_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GH_REF_NAME already exists; skipping."
            exit 0
          fi
          if [[ "$GH_REF_NAME" == *-* ]]; then
            gh release create "$GH_REF_NAME" --generate-notes --prerelease --verify-tag
          else
            gh release create "$GH_REF_NAME" --generate-notes --verify-tag
          fi
