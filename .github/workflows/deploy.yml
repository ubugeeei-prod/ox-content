name: Validate Cloudflare docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/deploy.yml
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tools/deploy/**
      - tools/scripts/*cloudflare*
      - tools/scripts/build-docs-on-cloudflare.sh
      - tools/scripts/prepare-docs-deployment*
      - docs/vite.config.ts
      - examples/playground/vite.config.ts
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Cloudflare docs
    runs-on: blacksmith-32vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          cache: true
          run-install: true

      - name: Mount sticky cache
        uses: ./.github/actions/mount-sticky-cache
        with:
          key-prefix: ${{ github.repository }}-deploy-${{ github.job }}
          cargo: "true"
          target: target
          browsers: "true"

      - name: Check TypeScript for native Node execution
        run: vp run deploy#check

      - name: Check deployment bundle preparation
        run: node --test tools/scripts/prepare-docs-deployment.test.ts

      - name: Check Cloudflare CLI argument forwarding
        run: vp run deploy#cf -- --version

      - name: Build with the Workers Builds entry point
        run: bash tools/scripts/build-docs-on-cloudflare.sh

      - name: Validate Cloudflare deployment without credentials
        run: vp run deploy#cf -- deploy --prebuilt --mode production --dry-run
