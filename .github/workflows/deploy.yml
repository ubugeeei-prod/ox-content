name: Deploy docs to Cloudflare

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/deploy.yml
      - wrangler.jsonc
      - tools/deploy/**
      - tools/scripts/*cloudflare*
      - tools/scripts/prepare-docs-deployment*
      - docs/vite.config.ts
      - examples/playground/vite.config.ts
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Cloudflare docs
    runs-on: blacksmith-32vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          cache: true
          run-install: true

      - name: Mount sticky cache
        uses: ./.github/actions/mount-sticky-cache
        with:
          key-prefix: ${{ github.repository }}-deploy-${{ github.job }}
          cargo: "true"
          target: target
          browsers: "true"

      - name: Install browsers for docs rendering
        run: |
          vp exec --filter @ox-content/vite-plugin -- playwright install chromium
          vp exec --filter @ox-content/vite-plugin -- puppeteer browsers install chrome-headless-shell

      - name: Check deployment bundle preparation
        run: node --test tools/scripts/prepare-docs-deployment.test.mjs

      - name: Build and validate Cloudflare deployment
        run: vp run deploy#docs -- --dry-run

      - name: Deploy to ox-content.dev
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets. See docs/content/deployment.md."
            exit 1
          fi
          node tools/scripts/cloudflare-cli.mjs deploy
