name: Build native CLI packages

on:
  workflow_call:

permissions:
  contents: read

jobs:
  native-cli-package:
    name: Native CLI package - ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            binary: oxct
          - os: macos-15-intel
            target: x86_64-apple-darwin
            binary: oxct
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: oxct
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            binary: oxct.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: ${{ matrix.target }}
      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Build standalone runner
        run: cargo build --locked --release -p ox_content_cli --bin oxct --target ${{ matrix.target }}
      - name: Verify, package and checksum native runner
        shell: bash
        run: python3 tools/scripts/package-native-cli.py "target/${{ matrix.target }}/release/${{ matrix.binary }}" "${{ matrix.target }}"
      - name: Upload native package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-cli-${{ matrix.target }}
          path: dist/native/*
          if-no-files-found: error
