name: Native CLI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native-cli:
    name: Native CLI - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [blacksmith-32vcpu-ubuntu-2404, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Test Rust authoring commands
        run: cargo test --locked -p ox_content_cli

      - name: Build Rust launcher
        run: cargo build --locked -p ox_content_cli --bin oxct

      - name: Verify terminal navigation and restoration
        if: runner.os != 'Windows'
        run: python3 tools/scripts/test-tui-pty.py target/debug/oxct

  markdown-lint-performance:
    name: Markdown lint performance
    runs-on: blacksmith-32vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Benchmark base and head on the same corpus
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git worktree add --detach /tmp/ox-lint-base "$BASE_SHA"
          mkdir -p /tmp/ox-lint-base/crates/ox_content_markdown_lint/benches
          cp crates/ox_content_markdown_lint/benches/throughput.rs /tmp/ox-lint-base/crates/ox_content_markdown_lint/benches/throughput.rs
          python3 tools/scripts/prepare-lint-benchmark.py /tmp/ox-lint-base/crates/ox_content_markdown_lint/Cargo.toml
          mkdir -p lint-perf
          LINT_BENCH_THREADS=1 cargo bench --manifest-path /tmp/ox-lint-base/Cargo.toml -p ox_content_markdown_lint --bench throughput > lint-perf/base-1.json
          LINT_BENCH_THREADS=1 cargo bench --locked -p ox_content_markdown_lint --bench throughput > lint-perf/head-1.json
          LINT_BENCH_THREADS=8 cargo bench --locked -p ox_content_markdown_lint --bench throughput > lint-perf/head-8.json

      - name: Measure CLI including file reads and stdout
        run: |
          cargo build --locked --release -p ox_content_cli --bin oxct
          python3 tools/scripts/benchmark-markdown-lint.py target/release/oxct > lint-perf/cli.json
          python3 tools/scripts/report-lint-benchmark.py lint-perf >> "$GITHUB_STEP_SUMMARY"

      - name: Upload lint performance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: markdown-lint-performance
          path: lint-perf
          if-no-files-found: error
