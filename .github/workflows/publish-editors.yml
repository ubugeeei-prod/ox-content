name: Publish editor extensions

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to package. Defaults to package metadata."
        required: false
        type: string
      publish:
        description: "Publish VS Code / Open VSX artifacts instead of packaging only."
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read
  pull-requests: read

env:
  CARGO_TERM_COLOR: always

jobs:
  authorize:
    uses: ./.github/workflows/authorize-release.yml

  build-editors:
    needs: authorize
    uses: ./.github/workflows/build-release-editors.yml

  publish-vscode-marketplace:
    name: Publish VS Code Marketplace
    runs-on: ubuntu-latest
    needs: build-editors
    environment: vscode-marketplace
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          cache: false
          run-install: false

      - name: Download VSIX artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: vscode-vsix-*
          path: dist/vscode
          merge-multiple: true

      - name: Publish with vsce
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          PUBLISH_FROM_DISPATCH: ${{ inputs.publish }}
        run: node tools/scripts/publish-editor-extensions.ts vscode-marketplace

  publish-open-vsx:
    name: Publish Open VSX
    runs-on: ubuntu-latest
    needs: build-editors
    environment: open-vsx
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          cache: false
          run-install: false

      - name: Download VSIX artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: vscode-vsix-*
          path: dist/vscode
          merge-multiple: true

      - name: Publish with Open VSX trusted publishing
        env:
          PUBLISH_FROM_DISPATCH: ${{ inputs.publish }}
        run: node tools/scripts/publish-editor-extensions.ts open-vsx

  prepare-zed-registry:
    name: Prepare Zed registry patch
    runs-on: ubuntu-latest
    needs: authorize
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          run-install: false

      # Zed requires human-authored PRs and maintainer communication. Prepare
      # a reviewable patch without credentials that can push to its registry.
      - name: Prepare registration against the released commit
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${VERSION_INPUT:-}"
          release_ref="$GITHUB_SHA"
          if [ -n "$version" ]; then
            release_ref="refs/tags/v${version}"
          else
            version=$(node -p "JSON.parse(require('fs').readFileSync('npm/vscode-ox-content/package.json')).version")
          fi
          git clone --depth 1 https://github.com/zed-industries/extensions.git zed-extensions
          cd zed-extensions
          if [ -d extensions/ox-content ]; then
            git submodule update --init extensions/ox-content
            git -C extensions/ox-content fetch origin --tags
          else
            git submodule add https://github.com/ubugeeei-prod/ox-content.git extensions/ox-content
          fi
          git -C extensions/ox-content checkout --detach "$release_ref"
          actual_version=$(sed -n 's/^version = "\(.*\)"/\1/p' extensions/ox-content/editors/zed/extension.toml)
          if [ "$actual_version" != "$version" ]; then
            echo "::error::Zed metadata does not match the requested version."
            exit 1
          fi
          perl -0pi -e \
            's/\[ox-content\]\n(?:[^\[]*\n)*/[ox-content]\nsubmodule = "extensions\/ox-content"\npath = "editors\/zed"\nversion = "'$version'"\n\n/s' \
            extensions.toml
          if ! grep -q '^\[ox-content\]' extensions.toml; then
            {
              printf '\n[ox-content]\n'
              printf 'submodule = "extensions/ox-content"\n'
              printf 'path = "editors/zed"\n'
              printf 'version = "%s"\n' "$version"
            } >> extensions.toml
          fi
          vp env exec --node 26 --package-manager pnpm@12.1.0 pnpm install --frozen-lockfile
          vp env exec --node 26 --package-manager pnpm@12.1.0 pnpm sort-extensions
          git add .gitmodules extensions.toml extensions/ox-content
          mkdir -p ../dist/zed-registry
          git diff --cached --binary > "../dist/zed-registry/ox-content-${version}.patch"
          git rev-parse HEAD > ../dist/zed-registry/registry-base.txt
          git -C extensions/ox-content rev-parse HEAD > ../dist/zed-registry/extension-commit.txt

      - name: Upload patch for maintainer submission
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zed-registry-patch
          path: dist/zed-registry/*
          if-no-files-found: error
