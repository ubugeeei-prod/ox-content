name: Publish editor extensions

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to package. Defaults to package metadata."
        required: false
        type: string
      publish:
        description: "Publish VS Code / Open VSX artifacts instead of packaging only."
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read
  pull-requests: read

env:
  CARGO_TERM_COLOR: always

jobs:
  authorize:
    uses: ./.github/workflows/authorize-release.yml

  build-editors:
    needs: authorize
    uses: ./.github/workflows/build-release-editors.yml

  publish-vscode-marketplace:
    name: Publish VS Code Marketplace
    runs-on: ubuntu-latest
    needs: build-editors
    environment: vscode-marketplace
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@24d870228786dc83ae73482406bdd1e7befaec14 # v1.21.0
        with:
          cache: false
          run-install: false

      - name: Download VSIX artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: vscode-vsix-*
          path: dist/vscode
          merge-multiple: true

      - name: Publish with vsce
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          PUBLISH_FROM_DISPATCH: ${{ inputs.publish }}
        run: node tools/scripts/publish-editor-extensions.ts vscode-marketplace

  publish-open-vsx:
    name: Publish Open VSX
    runs-on: ubuntu-latest
    needs: build-editors
    environment: open-vsx
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@24d870228786dc83ae73482406bdd1e7befaec14 # v1.21.0
        with:
          cache: false
          run-install: false

      - name: Download VSIX artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: vscode-vsix-*
          path: dist/vscode
          merge-multiple: true

      - name: Publish with ovsx
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
          PUBLISH_FROM_DISPATCH: ${{ inputs.publish }}
        run: node tools/scripts/publish-editor-extensions.ts open-vsx

  open-zed-registry-pr:
    name: Open Zed registry PR
    runs-on: ubuntu-latest
    needs: build-editors
    steps:
      - name: Open registry pull request
        env:
          GH_TOKEN: ${{ secrets.ZED_EXTENSIONS_PAT }}
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::ZED_EXTENSIONS_PAT is not configured; skipping Zed registry PR."
            exit 0
          fi
          gh auth setup-git
          version="$VERSION_INPUT"
          if [ -z "$version" ]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          if [ -z "$version" ] || [ "$version" = "$GITHUB_REF_NAME" ]; then
            echo "::error::A version is required for manual Zed registry PR dispatch."
            exit 1
          fi
          branch="ox-content-${version}"
          gh repo clone zed-industries/extensions zed-extensions
          cd zed-extensions
          git switch -c "$branch"
          if [ -d extensions/ox-content ]; then
            git submodule update --init extensions/ox-content
            git -C extensions/ox-content fetch origin
            git -C extensions/ox-content checkout -B main origin/main
          else
            git submodule add https://github.com/ubugeeei-prod/ox-content.git extensions/ox-content
          fi
          perl -0pi -e \
            's/\[ox-content\]\n(?:[^\[]*\n)*/[ox-content]\nsubmodule = "extensions\/ox-content"\npath = "editors\/zed"\nversion = "'$version'"\n\n/s' \
            extensions.toml
          if ! grep -q '^\[ox-content\]' extensions.toml; then
            {
              printf '\n[ox-content]\n'
              printf 'submodule = "extensions/ox-content"\n'
              printf 'path = "editors/zed"\n'
              printf 'version = "%s"\n' "$version"
            } >> extensions.toml
          fi
          corepack enable
          pnpm install --frozen-lockfile
          pnpm sort-extensions
          git add .gitmodules extensions.toml extensions/ox-content
          git -c user.name="ox-content release" \
            -c user.email="actions@github.com" \
            commit -m "ox-content ${version}"
          git push --set-upstream origin "$branch"
          gh pr create \
            --repo zed-industries/extensions \
            --title "ox-content ${version}" \
            --body "Update ox-content to ${version}."
