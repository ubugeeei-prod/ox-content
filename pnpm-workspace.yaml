packages:
  - crates/ox_content_napi
  - crates/ox_content_wasm/pkg
  - npm/*
  - npm/theme/*
  - npm/theme-color/*
  - docs
  - tools/deploy
  - examples/*
  - tools/benchmarks/*
  - tools/benchmarks/bundle-size/apps/*

catalog:
  "@solidjs/vite-plugin": ^3.0.0-next.43
  "@solidjs/web": ^2.0.0-rc.8
  "@sveltejs/vite-plugin-svelte": ^7.2.0
  "@types/node": ^26.6.1
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@vitejs/plugin-react": ^6.1.1
  "@vitejs/plugin-vue": ^6.0.9
  "@typescript/native-preview": ^7.0.0-dev.20260707.2
  esbuild: ^0.28.1
  react: ^19.3.0
  react-dom: ^19.3.0
  solid-js: ^2.0.0-rc.8
  svelte: ^5.57.0
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@0.3.2
  vitest: 4.1.11
  vue: ^3.5.43
  vite-plus: 0.3.2

allowBuilds:
  esbuild: true
  sharp: true
  puppeteer: true
  workerd: true

packageExtensions:
  "@voidzero-dev/vite-plus-core@0.1.21":
    dependencies:
      picomatch: ^4.0.4
overrides:
  # Benchmark fixtures have no remote images; disable their optional remote-image cache.
  "astro>http-cache-semantics": "-"
  # Security fixes in devalue 5.9.3+, preserving the existing major version.
  devalue@5: "5.9.4"
  vite: "catalog:"
  vitest: "catalog:"
  # GHSA-6j4f-fj2g-mc7p and GHSA-qhr7-859c-m2p7: brace-expansion recursion DoS.
  brace-expansion@2: "2.1.7"
  brace-expansion@5: "5.0.12"
  # GHSA-rfgv-xxqx-mfg5, GHSA-vp8m-p9jh-q5pm, GHSA-w293-vg96-wgc3: fixed in 8.10.2.
  undici@8: "8.10.2"
  # GHSA-28wg-ghj8-5hjv, GHSA-2v37-7h3g-55p8: nanoid, patched in 3.3.17.
  nanoid@3: "3.3.18"
  # GHSA-2883-xcg3-v3hh: js-yaml, patched in 4.3.2.
  js-yaml@4: "4.3.2"
  # GHSA-5c6j-r48x-rmvq, GHSA-8vm4-qpp2-4pmw: serialize-javascript, patched in 7.0.5.
  serialize-javascript@6: "7.0.5"
  # GHSA-fx2h-pf6j-xcff: Vite Windows path bypass, patched in 8.0.16.
  vite@8: "8.0.16"
  # GHSA-r28c-9q8g-f849, GHSA-fxqj-8p7j-g6m6: postcss, patched in 8.5.23.
  postcss@8: "8.5.26"
  # GHSA-5jgf-p345-68v8, GHSA-f65p-4m7j-42xc, GHSA-fph4-wmhf-6fwf, GHSA-jqff-g426-hqxp,
  # GHSA-58mr-gqgx-xq4g, GHSA-qw65-cvwx-89v3: fast-uri, patched in 3.1.8.
  fast-uri: "3.1.8"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
minimumReleaseAgeExclude:
  - "@mizchi/markdown@0.8.3"
  # Pin the newly launched cf CLI and its matching Cloudflare packages.
  - "@cloudflare/build-output-utils@0.8.4"
  - "@cloudflare/codemods@0.3.0"
  - "@cloudflare/config@0.22.0"
  - "@cloudflare/runtime-types@0.1.6"
  - "@cloudflare/workerd-darwin-64@1.20260930.2"
  - "@cloudflare/workerd-darwin-arm64@1.20260930.2"
  - "@cloudflare/workerd-linux-64@1.20260930.2"
  - "@cloudflare/workerd-linux-arm64@1.20260930.2"
  - "@cloudflare/workerd-windows-64@1.20260930.2"
  - cf@1.0.0-beta.9
  - miniflare@5.20260930.0-alpha
  - workerd@1.20260930.2
patchedDependencies:
  astro@7.3.3: patches/astro@7.3.3.patch
