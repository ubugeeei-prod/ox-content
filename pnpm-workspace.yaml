packages:
  - crates/ox_content_napi
  - crates/ox_content_wasm/pkg
  - npm/*
  - npm/theme/*
  - npm/theme-color/*
  - docs
  - deploy
  - examples/*
  - benchmarks/*
  - benchmarks/bundle-size/apps/*

catalog:
  "@sveltejs/vite-plugin-svelte": ^7.2.0
  "@types/node": ^26.2.0
  "@types/react": ^19.2.18
  "@types/react-dom": ^19.2.4
  "@vitejs/plugin-react": ^6.1.0
  "@vitejs/plugin-vue": ^6.0.8
  "@typescript/native-preview": ^7.0.0-dev.20260707.2
  esbuild: ^0.28.1
  react: ^19.0.0
  react-dom: ^19.0.0
  solid-js: ^1.9.15
  svelte: ^5.56.10
  typescript: ^7.0.2
  vite-plugin-solid: ^2.11.14
  vite: npm:@voidzero-dev/vite-plus-core@0.2.8
  vitest: 4.1.11
  vue: ^3.5.41
  vite-plus: 0.3.0

allowBuilds:
  esbuild: true
  sharp: true
  puppeteer: true

packageExtensions:
  "@voidzero-dev/vite-plus-core@0.1.21":
    dependencies:
      picomatch: ^4.0.4
overrides:
  vite: "catalog:"
  vitest: "catalog:"
  # GHSA-rgw5-rvv9-x895: ReDoS in brace-expansion, patched in 2.1.4 and 5.0.9.
  brace-expansion@2: "2.1.4"
  brace-expansion@5: "5.0.9"
  # GHSA-28wg-ghj8-5hjv, GHSA-2v37-7h3g-55p8: nanoid, patched in 3.3.17.
  nanoid@3: "3.3.18"
  # GHSA-5p4m-2wfm-xmqj: js-yaml, patched in 4.3.1.
  js-yaml@4: "4.3.1"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
minimumReleaseAgeExclude:
  - "@mizchi/markdown@0.8.2"
