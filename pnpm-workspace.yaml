packages:
  - crates/ox_content_napi
  - crates/ox_content_wasm/pkg
  - npm/*
  - docs
  - deploy
  - examples/*
  - benchmarks/*
  - benchmarks/bundle-size/apps/*

catalog:
  "@sveltejs/vite-plugin-svelte": ^7.1.2
  "@types/node": ^25.8.0
  "@types/react": ^19.2.14
  "@types/react-dom": ^19.0.0
  "@vitejs/plugin-react": ^6.0.2
  "@vitejs/plugin-vue": ^6.0.0
  "@typescript/native-preview": ^7.0.0-dev.20260518.1
  esbuild: ^0.27.4
  react: ^19.0.0
  react-dom: ^19.0.0
  solid-js: ^1.9.14
  svelte: ^5.55.7
  typescript: ^6.0.3
  vite-plugin-solid: ^2.11.14
  vite: npm:@voidzero-dev/vite-plus-core@0.1.21
  vitest: npm:@voidzero-dev/vite-plus-test@0.1.21
  vue: ^3.5.34
  vite-plus: 0.1.21

onlyBuiltDependencies:
  - esbuild
  - sharp
  - puppeteer
packageExtensions:
  "@voidzero-dev/vite-plus-core@0.1.21":
    dependencies:
      picomatch: ^4.0.4
overrides:
  vite: "catalog:"
  vitest: "catalog:"
  # GHSA-rgw5-rvv9-x895: ReDoS in brace-expansion, patched in 2.1.4 and 5.0.9.
  brace-expansion@2: "2.1.4"
  brace-expansion@5: "5.0.9"
  # GHSA-28wg-ghj8-5hjv, GHSA-2v37-7h3g-55p8: nanoid, patched in 3.3.17.
  nanoid@3: "3.3.18"
  # GHSA-5p4m-2wfm-xmqj: js-yaml, patched in 4.3.1.
  js-yaml@4: "4.3.1"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
