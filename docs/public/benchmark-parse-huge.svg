  <text x="540" y="236" text-anchor="end" class="value">50</text>
  <text x="545" y="236" class="unit">ops/s</text>
  <text x="636" y="236" text-anchor="end" class="ratio">10.41x</text>

  <text x="120" y="266" text-anchor="end" class="label">md4x (wasm)</text>
  <rect x="130" y="252" width="24" height="20" rx="4" fill="url(#grayGrad)"/>
  <text x="540" y="266" text-anchor="end" class="value">42</text>
  <text x="545" y="266" class="unit">ops/s</text>
  <text x="636" y="266" text-anchor="end" class="ratio">12.35x</text>

  <text x="120" y="296" text-anchor="end" class="label">satteri</text>
  <rect x="130" y="282" width="15" height="20" rx="4" fill="url(#grayGrad)"/>
