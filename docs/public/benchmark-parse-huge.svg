<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 548">
  <defs>
    <linearGradient id="oxGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7a5cff"/>
      <stop offset="100%" style="stop-color:#4acdff"/>
    </linearGradient>
    <linearGradient id="grayGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4f607b"/>
      <stop offset="100%" style="stop-color:#8190b0"/>
    </linearGradient>
  </defs>

  <style>
    .title { font: bold 14px IBM Plex Sans, system-ui, sans-serif; fill: #131a30; }
    .label { font: 12px IBM Plex Sans, system-ui, sans-serif; fill: #4f607b; }
    .value { font: bold 11px IBM Plex Sans, system-ui, sans-serif; fill: #131a30; }
    .unit { font: 10px IBM Plex Sans, system-ui, sans-serif; fill: #8190b0; }
    .ratio { font: bold 10px IBM Plex Sans, system-ui, sans-serif; fill: #364462; }
  </style>

  <rect width="650" height="548" fill="#f5f7fb" rx="8"/>

  <text x="325" y="24" text-anchor="middle" class="title">Parse Speed (Huge 1.02 MB)</text>

  <text x="120" y="56" text-anchor="end" class="label">ox-content (native)</text>
  <rect x="130" y="42" width="300" height="20" rx="4" fill="url(#oxGrad)"/>
  <text x="540" y="56" text-anchor="end" class="value">528</text>
  <text x="545" y="56" class="unit">ops/s</text>
  <text x="636" y="56" text-anchor="end" class="ratio">1.00x</text>

  <text x="120" y="86" text-anchor="end" class="label">@ox-content/napi</text>
  <rect x="130" y="72" width="172" height="20" rx="4" fill="url(#oxGrad)"/>
  <text x="540" y="86" text-anchor="end" class="value">303</text>
  <text x="545" y="86" class="unit">ops/s</text>
  <text x="636" y="86" text-anchor="end" class="ratio">1.74x</text>

  <text x="120" y="116" text-anchor="end" class="label">pulldown-cmark</text>
  <rect x="130" y="102" width="133" height="20" rx="4" fill="url(#grayGrad)"/>
  <text x="540" y="116" text-anchor="end" class="value">233</text>
  <text x="545" y="116" class="unit">ops/s</text>
  <text x="636" y="116" text-anchor="end" class="ratio">2.26x</text>

  <text x="120" y="146" text-anchor="end" class="label">xai-grok-markdown-core (Grok Build)</text>
  <rect x="130" y="132" width="121" height="20" rx="4" fill="url(#grayGrad)"/>
  <text x="540" y="146" text-anchor="end" class="value">213</text>
  <text x="545" y="146" class="unit">ops/s</text>
  <text x="636" y="146" text-anchor="end" class="ratio">2.48x</text>

  <text x="120" y="176" text-anchor="end" class="label">md4w (md4c)</text>
  <rect x="130" y="162" width="27" height="20" rx="4" fill="url(#grayGrad)"/>
  <text x="540" y="176" text-anchor="end" class="value">48</text>
  <text x="545" y="176" class="unit">ops/s</text>
  <text x="636" y="176" text-anchor="end" class="ratio">10.98x</text>

  <text x="120" y="206" text-anchor="end" class="label">md4x (napi)</text>
  <rect x="130" y="192" width="26" height="20" rx="4" fill="url(#grayGrad)"/>
  <text x="540" y="206" text-anchor="end" class="value">46</text>
  <text x="545" y="206" class="unit">ops/s</text>
  <text x="636" y="206" text-anchor="end" class="ratio">11.39x</text>

  <text x="120" y="236" text-anchor="end" class="label">md4x (wasm)</text>
  <rect x="130" y="222" width="25" height="20" rx="4" fill="url(#grayGrad)"/>
  <text x="540" y="236" text-anchor="end" class="value">44</text>
  <text x="545" y="236" class="unit">ops/s</text>
  <text x="636" y="236" text-anchor="end" class="ratio">12.13x</text>

  <text x="120" y="266" text-anchor="end" class="label">satteri</text>
  <rect x="130" y="252" width="15" height="20" rx="4" fill="url(#grayGrad)"/>
  <text x="540" y="266" text-anchor="end" class="value">26</text>
  <text x="545" y="266" class="unit">ops/s</text>
  <text x="636" y="266" text-anchor="end" class="ratio">20.05x</text>

  <text x="120" y="296" text-anchor="end" class="label">@tanstack/markdown</text>
  <rect x="130" y="282" width="13" height="20" rx="4" fill="url(#grayGrad)"/>
