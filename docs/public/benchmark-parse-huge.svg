  <text x="545" y="296" class="unit">ops/s</text>
  <text x="636" y="296" text-anchor="end" class="ratio">23.07x</text>

  <text x="120" y="326" text-anchor="end" class="label">@mizchi/markdown (native)</text>
  <rect x="130" y="312" width="13" height="20" rx="4" fill="url(#grayGrad)"/>
  <text x="540" y="326" text-anchor="end" class="value">22</text>
  <text x="545" y="326" class="unit">ops/s</text>
  <text x="636" y="326" text-anchor="end" class="ratio">23.47x</text>

  <text x="120" y="356" text-anchor="end" class="label">markdown-it-ts</text>
  <rect x="130" y="342" width="12" height="20" rx="4" fill="url(#grayGrad)"/>
  <text x="540" y="356" text-anchor="end" class="value">22</text>
  <text x="545" y="356" class="unit">ops/s</text>
  <text x="636" y="356" text-anchor="end" class="ratio">24.23x</text>

  <text x="120" y="386" text-anchor="end" class="label">marked</text>
  <rect x="130" y="372" width="8" height="20" rx="4" fill="url(#grayGrad)"/>
  <text x="540" y="386" text-anchor="end" class="value">14</text>
  <text x="545" y="386" class="unit">ops/s</text>
  <text x="636" y="386" text-anchor="end" class="ratio">37.17x</text>

  <text x="120" y="416" text-anchor="end" class="label">@mizchi/markdown (wasm)</text>
  <rect x="130" y="402" width="7" height="20" rx="4" fill="url(#grayGrad)"/>
  <text x="540" y="416" text-anchor="end" class="value">11</text>
  <text x="545" y="416" class="unit">ops/s</text>
  <text x="636" y="416" text-anchor="end" class="ratio">46.06x</text>

  <text x="120" y="446" text-anchor="end" class="label">markdown-it</text>
  <rect x="130" y="432" width="6" height="20" rx="4" fill="url(#grayGrad)"/>
  <text x="540" y="446" text-anchor="end" class="value">10</text>
  <text x="545" y="446" class="unit">ops/s</text>
  <text x="636" y="446" text-anchor="end" class="ratio">51.46x</text>

  <text x="120" y="476" text-anchor="end" class="label">@mizchi/markdown (js)</text>
  <rect x="130" y="462" width="6" height="20" rx="4" fill="url(#grayGrad)"/>
  <text x="540" y="476" text-anchor="end" class="value">10</text>
  <text x="545" y="476" class="unit">ops/s</text>
  <text x="636" y="476" text-anchor="end" class="ratio">51.86x</text>

  <text x="120" y="506" text-anchor="end" class="label">remark</text>
  <rect x="130" y="492" width="4" height="20" rx="4" fill="url(#grayGrad)"/>
  <text x="540" y="506" text-anchor="end" class="value">1</text>
  <text x="545" y="506" class="unit">ops/s</text>
  <text x="636" y="506" text-anchor="end" class="ratio">617x</text>

  <text x="325" y="536" text-anchor="middle" class="unit">Higher is better. Ratio shows how much slower vs ox-content.</text>
</svg>
