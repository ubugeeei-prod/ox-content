  <text x="545" y="386" class="unit">ops/s</text>
  <text x="636" y="386" text-anchor="end" class="ratio">19.75x</text>

  <text x="120" y="416" text-anchor="end" class="label">@mizchi/markdown</text>
  <rect x="130" y="402" width="13" height="20" rx="4" fill="url(#grayGrad)"/>
