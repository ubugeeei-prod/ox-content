  <text x="545" y="146" class="unit">ops/s</text>
  <text x="636" y="146" text-anchor="end" class="ratio">1.82x</text>

  <text x="120" y="176" text-anchor="end" class="label">md4x (napi)</text>
  <rect x="130" y="162" width="132" height="20" rx="4" fill="url(#grayGrad)"/>
  <text x="540" y="176" text-anchor="end" class="value">3,212</text>
  <text x="545" y="176" class="unit">ops/s</text>
  <text x="636" y="176" text-anchor="end" class="ratio">2.27x</text>

