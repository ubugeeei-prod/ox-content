  <text x="120" y="326" text-anchor="end" class="label">markdown-it-ts</text>
  <rect x="130" y="312" width="32" height="20" rx="4" fill="url(#grayGrad)"/>
  <text x="540" y="326" text-anchor="end" class="value">778</text>
  <text x="545" y="326" class="unit">ops/s</text>
  <text x="636" y="326" text-anchor="end" class="ratio">9.37x</text>

