  <rect x="130" y="252" width="97" height="20" rx="4" fill="url(#grayGrad)"/>
  <text x="540" y="266" text-anchor="end" class="value">2,361</text>
  <text x="545" y="266" class="unit">ops/s</text>
  <text x="636" y="266" text-anchor="end" class="ratio">3.09x</text>

  <text x="120" y="296" text-anchor="end" class="label">md4x (wasm)</text>
