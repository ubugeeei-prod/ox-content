  <rect x="130" y="342" width="25" height="20" rx="4" fill="url(#grayGrad)"/>
  <text x="540" y="356" text-anchor="end" class="value">601</text>
  <text x="545" y="356" class="unit">ops/s</text>
  <text x="636" y="356" text-anchor="end" class="ratio">12.12x</text>

  <text x="120" y="386" text-anchor="end" class="label">@mizchi/markdown (wasm)</text>
  <rect x="130" y="372" width="22" height="20" rx="4" fill="url(#grayGrad)"/>
  <text x="540" y="386" text-anchor="end" class="value">524</text>
  <text x="545" y="386" class="unit">ops/s</text>
  <text x="636" y="386" text-anchor="end" class="ratio">13.92x</text>

  <text x="120" y="416" text-anchor="end" class="label">@mizchi/markdown (js)</text>
  <rect x="130" y="402" width="20" height="20" rx="4" fill="url(#grayGrad)"/>
  <text x="540" y="416" text-anchor="end" class="value">496</text>
  <text x="545" y="416" class="unit">ops/s</text>
  <text x="636" y="416" text-anchor="end" class="ratio">14.68x</text>

  <text x="120" y="446" text-anchor="end" class="label">@tanstack/markdown</text>
  <rect x="130" y="432" width="19" height="20" rx="4" fill="url(#grayGrad)"/>
  <text x="540" y="446" text-anchor="end" class="value">453</text>
  <text x="545" y="446" class="unit">ops/s</text>
  <text x="636" y="446" text-anchor="end" class="ratio">16.09x</text>

  <text x="120" y="476" text-anchor="end" class="label">marked</text>
  <rect x="130" y="462" width="15" height="20" rx="4" fill="url(#grayGrad)"/>
  <text x="540" y="476" text-anchor="end" class="value">359</text>
  <text x="545" y="476" class="unit">ops/s</text>
  <text x="636" y="476" text-anchor="end" class="ratio">20.29x</text>

  <text x="120" y="506" text-anchor="end" class="label">markdown-it</text>
  <rect x="130" y="492" width="12" height="20" rx="4" fill="url(#grayGrad)"/>
  <text x="540" y="506" text-anchor="end" class="value">293</text>
  <text x="545" y="506" class="unit">ops/s</text>
  <text x="636" y="506" text-anchor="end" class="ratio">24.91x</text>

  <text x="120" y="536" text-anchor="end" class="label">micromark</text>
  <rect x="130" y="522" width="4" height="20" rx="4" fill="url(#grayGrad)"/>
  <text x="540" y="536" text-anchor="end" class="value">31</text>
  <text x="545" y="536" class="unit">ops/s</text>
  <text x="636" y="536" text-anchor="end" class="ratio">234x</text>

  <text x="120" y="566" text-anchor="end" class="label">remark</text>
  <rect x="130" y="552" width="4" height="20" rx="4" fill="url(#grayGrad)"/>
  <text x="540" y="566" text-anchor="end" class="value">26</text>
  <text x="545" y="566" class="unit">ops/s</text>
  <text x="636" y="566" text-anchor="end" class="ratio">281x</text>

  <text x="325" y="596" text-anchor="middle" class="unit">Higher is better. Ratio shows how much slower vs ox-content.</text>
</svg>
