  <text x="545" y="506" class="unit">ops/s</text>
  <text x="636" y="506" text-anchor="end" class="ratio">265x</text>

  <text x="325" y="536" text-anchor="middle" class="unit">Higher is better. Ratio shows how much slower vs ox-content.</text>
