<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 488">
  <defs>
    <linearGradient id="oxGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7a5cff"/>
      <stop offset="100%" style="stop-color:#4acdff"/>
    </linearGradient>
    <linearGradient id="grayGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4f607b"/>
      <stop offset="100%" style="stop-color:#8190b0"/>
    </linearGradient>
  </defs>

  <style>
    .title { font: bold 14px IBM Plex Sans, system-ui, sans-serif; fill: #131a30; }
    .label { font: 12px IBM Plex Sans, system-ui, sans-serif; fill: #4f607b; }
    .value { font: bold 11px IBM Plex Sans, system-ui, sans-serif; fill: #131a30; }
    .unit { font: 10px IBM Plex Sans, system-ui, sans-serif; fill: #8190b0; }
    .ratio { font: bold 10px IBM Plex Sans, system-ui, sans-serif; fill: #364462; }
  </style>

  <rect width="650" height="488" fill="#f5f7fb" rx="8"/>

  <text x="325" y="24" text-anchor="middle" class="title">Parse Speed (Large 48.7 KB)</text>

  <text x="120" y="56" text-anchor="end" class="label">ox-content (native)</text>
  <rect x="130" y="42" width="300" height="20" rx="4" fill="url(#oxGrad)"/>
  <text x="540" y="56" text-anchor="end" class="value">7,739</text>
  <text x="545" y="56" class="unit">ops/s</text>
  <text x="636" y="56" text-anchor="end" class="ratio">1.00x</text>

  <text x="120" y="86" text-anchor="end" class="label">pulldown-cmark</text>
  <rect x="130" y="72" width="192" height="20" rx="4" fill="url(#grayGrad)"/>
  <text x="540" y="86" text-anchor="end" class="value">4,941</text>
  <text x="545" y="86" class="unit">ops/s</text>
  <text x="636" y="86" text-anchor="end" class="ratio">1.57x</text>

  <text x="120" y="116" text-anchor="end" class="label">xai-grok-markdown-core (Grok Build)</text>
  <rect x="130" y="102" width="164" height="20" rx="4" fill="url(#grayGrad)"/>
  <text x="540" y="116" text-anchor="end" class="value">4,233</text>
  <text x="545" y="116" class="unit">ops/s</text>
  <text x="636" y="116" text-anchor="end" class="ratio">1.83x</text>

  <text x="120" y="146" text-anchor="end" class="label">@ox-content/napi</text>
  <rect x="130" y="132" width="135" height="20" rx="4" fill="url(#oxGrad)"/>
  <text x="540" y="146" text-anchor="end" class="value">3,479</text>
  <text x="545" y="146" class="unit">ops/s</text>
  <text x="636" y="146" text-anchor="end" class="ratio">2.22x</text>

  <text x="120" y="176" text-anchor="end" class="label">satteri</text>
  <rect x="130" y="162" width="59" height="20" rx="4" fill="url(#grayGrad)"/>
  <text x="540" y="176" text-anchor="end" class="value">1,521</text>
  <text x="545" y="176" class="unit">ops/s</text>
  <text x="636" y="176" text-anchor="end" class="ratio">5.09x</text>

  <text x="120" y="206" text-anchor="end" class="label">md4x (napi)</text>
  <rect x="130" y="192" width="45" height="20" rx="4" fill="url(#grayGrad)"/>
  <text x="540" y="206" text-anchor="end" class="value">1,157</text>
  <text x="545" y="206" class="unit">ops/s</text>
  <text x="636" y="206" text-anchor="end" class="ratio">6.69x</text>

  <text x="120" y="236" text-anchor="end" class="label">md4x (wasm)</text>
  <rect x="130" y="222" width="37" height="20" rx="4" fill="url(#grayGrad)"/>
  <text x="540" y="236" text-anchor="end" class="value">967</text>
  <text x="545" y="236" class="unit">ops/s</text>
  <text x="636" y="236" text-anchor="end" class="ratio">8.00x</text>

  <text x="120" y="266" text-anchor="end" class="label">md4w (md4c)</text>
  <rect x="130" y="252" width="36" height="20" rx="4" fill="url(#grayGrad)"/>
  <text x="540" y="266" text-anchor="end" class="value">931</text>
  <text x="545" y="266" class="unit">ops/s</text>
  <text x="636" y="266" text-anchor="end" class="ratio">8.31x</text>

  <text x="120" y="296" text-anchor="end" class="label">markdown-it-ts</text>
  <rect x="130" y="282" width="34" height="20" rx="4" fill="url(#grayGrad)"/>
  <text x="540" y="296" text-anchor="end" class="value">876</text>
  <text x="545" y="296" class="unit">ops/s</text>
  <text x="636" y="296" text-anchor="end" class="ratio">8.83x</text>

  <text x="120" y="326" text-anchor="end" class="label">@tanstack/markdown</text>
  <rect x="130" y="312" width="26" height="20" rx="4" fill="url(#grayGrad)"/>
  <text x="540" y="326" text-anchor="end" class="value">684</text>
  <text x="545" y="326" class="unit">ops/s</text>
  <text x="636" y="326" text-anchor="end" class="ratio">11.32x</text>

  <text x="120" y="356" text-anchor="end" class="label">marked</text>
  <rect x="130" y="342" width="16" height="20" rx="4" fill="url(#grayGrad)"/>
  <text x="540" y="356" text-anchor="end" class="value">420</text>
  <text x="545" y="356" class="unit">ops/s</text>
  <text x="636" y="356" text-anchor="end" class="ratio">18.45x</text>

  <text x="120" y="386" text-anchor="end" class="label">markdown-it</text>
  <rect x="130" y="372" width="11" height="20" rx="4" fill="url(#grayGrad)"/>
  <text x="540" y="386" text-anchor="end" class="value">285</text>
  <text x="545" y="386" class="unit">ops/s</text>
  <text x="636" y="386" text-anchor="end" class="ratio">27.16x</text>

  <text x="120" y="416" text-anchor="end" class="label">@mizchi/markdown</text>
  <rect x="130" y="402" width="4" height="20" rx="4" fill="url(#grayGrad)"/>
  <text x="540" y="416" text-anchor="end" class="value">59</text>
  <text x="545" y="416" class="unit">ops/s</text>
  <text x="636" y="416" text-anchor="end" class="ratio">130x</text>

  <text x="120" y="446" text-anchor="end" class="label">remark</text>
  <rect x="130" y="432" width="4" height="20" rx="4" fill="url(#grayGrad)"/>
  <text x="540" y="446" text-anchor="end" class="value">33</text>
  <text x="545" y="446" class="unit">ops/s</text>
  <text x="636" y="446" text-anchor="end" class="ratio">234x</text>

  <text x="325" y="476" text-anchor="middle" class="unit">Higher is better. Ratio shows how much slower vs ox-content.</text>
</svg>
