<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 608">
  <defs>
    <linearGradient id="oxGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7a5cff"/>
      <stop offset="100%" style="stop-color:#4acdff"/>
    </linearGradient>
    <linearGradient id="grayGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4f607b"/>
      <stop offset="100%" style="stop-color:#8190b0"/>
    </linearGradient>
  </defs>

  <style>
    .title { font: bold 14px IBM Plex Sans, system-ui, sans-serif; fill: #131a30; }
    .label { font: 12px IBM Plex Sans, system-ui, sans-serif; fill: #4f607b; }
    .value { font: bold 11px IBM Plex Sans, system-ui, sans-serif; fill: #131a30; }
    .unit { font: 10px IBM Plex Sans, system-ui, sans-serif; fill: #8190b0; }
    .ratio { font: bold 10px IBM Plex Sans, system-ui, sans-serif; fill: #364462; }
  </style>

  <rect width="650" height="608" fill="#f5f7fb" rx="8"/>

  <text x="325" y="24" text-anchor="middle" class="title">Parse + Render Speed (Huge 1.02 MB)</text>

  <text x="120" y="56" text-anchor="end" class="label">ferromark</text>
  <rect x="130" y="42" width="300" height="20" rx="4" fill="url(#grayGrad)"/>
  <text x="540" y="56" text-anchor="end" class="value">325</text>
  <text x="545" y="56" class="unit">ops/s</text>
  <text x="636" y="56" text-anchor="end" class="ratio">1.00x</text>

  <text x="120" y="86" text-anchor="end" class="label">ox-content (native)</text>
  <rect x="130" y="72" width="294" height="20" rx="4" fill="url(#oxGrad)"/>
  <text x="540" y="86" text-anchor="end" class="value">319</text>
  <text x="545" y="86" class="unit">ops/s</text>
  <text x="636" y="86" text-anchor="end" class="ratio">1.02x</text>

  <text x="120" y="116" text-anchor="end" class="label">@ox-content/napi</text>
  <rect x="130" y="102" width="234" height="20" rx="4" fill="url(#oxGrad)"/>
  <text x="540" y="116" text-anchor="end" class="value">253</text>
  <text x="545" y="116" class="unit">ops/s</text>
  <text x="636" y="116" text-anchor="end" class="ratio">1.28x</text>

  <text x="120" y="146" text-anchor="end" class="label">pulldown-cmark + push_html</text>
  <rect x="130" y="132" width="210" height="20" rx="4" fill="url(#grayGrad)"/>
  <text x="540" y="146" text-anchor="end" class="value">227</text>
  <text x="545" y="146" class="unit">ops/s</text>
  <text x="636" y="146" text-anchor="end" class="ratio">1.43x</text>

  <text x="120" y="176" text-anchor="end" class="label">Bun.markdown.html</text>
  <rect x="130" y="162" width="174" height="20" rx="4" fill="url(#grayGrad)"/>
  <text x="540" y="176" text-anchor="end" class="value">188</text>
  <text x="545" y="176" class="unit">ops/s</text>
  <text x="636" y="176" text-anchor="end" class="ratio">1.72x</text>

  <text x="120" y="206" text-anchor="end" class="label">md4x (napi)</text>
  <rect x="130" y="192" width="150" height="20" rx="4" fill="url(#grayGrad)"/>
  <text x="540" y="206" text-anchor="end" class="value">162</text>
  <text x="545" y="206" class="unit">ops/s</text>
  <text x="636" y="206" text-anchor="end" class="ratio">2.00x</text>

  <text x="120" y="236" text-anchor="end" class="label">satteri</text>
  <rect x="130" y="222" width="143" height="20" rx="4" fill="url(#grayGrad)"/>
  <text x="540" y="236" text-anchor="end" class="value">155</text>
  <text x="545" y="236" class="unit">ops/s</text>
  <text x="636" y="236" text-anchor="end" class="ratio">2.10x</text>

  <text x="120" y="266" text-anchor="end" class="label">md4w (md4c)</text>
  <rect x="130" y="252" width="107" height="20" rx="4" fill="url(#grayGrad)"/>
  <text x="540" y="266" text-anchor="end" class="value">116</text>
  <text x="545" y="266" class="unit">ops/s</text>
  <text x="636" y="266" text-anchor="end" class="ratio">2.81x</text>

  <text x="120" y="296" text-anchor="end" class="label">md4x (wasm)</text>
  <rect x="130" y="282" width="97" height="20" rx="4" fill="url(#grayGrad)"/>
  <text x="540" y="296" text-anchor="end" class="value">105</text>
  <text x="545" y="296" class="unit">ops/s</text>
  <text x="636" y="296" text-anchor="end" class="ratio">3.09x</text>

