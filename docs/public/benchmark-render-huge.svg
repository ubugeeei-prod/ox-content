  <rect x="130" y="312" width="19" height="20" rx="4" fill="url(#grayGrad)"/>
  <text x="540" y="326" text-anchor="end" class="value">20</text>
  <text x="545" y="326" class="unit">ops/s</text>
  <text x="636" y="326" text-anchor="end" class="ratio">16.09x</text>

  <text x="120" y="356" text-anchor="end" class="label">markdown-it-ts</text>
  <rect x="130" y="342" width="17" height="20" rx="4" fill="url(#grayGrad)"/>
  <text x="540" y="356" text-anchor="end" class="value">18</text>
  <text x="545" y="356" class="unit">ops/s</text>
  <text x="636" y="356" text-anchor="end" class="ratio">17.95x</text>

  <text x="120" y="386" text-anchor="end" class="label">@tanstack/markdown</text>
  <rect x="130" y="372" width="15" height="20" rx="4" fill="url(#grayGrad)"/>
  <text x="540" y="386" text-anchor="end" class="value">16</text>
  <text x="545" y="386" class="unit">ops/s</text>
  <text x="636" y="386" text-anchor="end" class="ratio">20.28x</text>

  <text x="120" y="416" text-anchor="end" class="label">marked</text>
  <rect x="130" y="402" width="12" height="20" rx="4" fill="url(#grayGrad)"/>
  <text x="540" y="416" text-anchor="end" class="value">13</text>
  <text x="545" y="416" class="unit">ops/s</text>
  <text x="636" y="416" text-anchor="end" class="ratio">25.36x</text>

  <text x="120" y="446" text-anchor="end" class="label">@mizchi/markdown (wasm)</text>
  <rect x="130" y="432" width="12" height="20" rx="4" fill="url(#grayGrad)"/>
  <text x="540" y="446" text-anchor="end" class="value">13</text>
  <text x="545" y="446" class="unit">ops/s</text>
  <text x="636" y="446" text-anchor="end" class="ratio">25.90x</text>

  <text x="120" y="476" text-anchor="end" class="label">@mizchi/markdown (js)</text>
  <rect x="130" y="462" width="10" height="20" rx="4" fill="url(#grayGrad)"/>
  <text x="540" y="476" text-anchor="end" class="value">11</text>
  <text x="545" y="476" class="unit">ops/s</text>
  <text x="636" y="476" text-anchor="end" class="ratio">29.04x</text>

  <text x="120" y="506" text-anchor="end" class="label">markdown-it</text>
  <rect x="130" y="492" width="9" height="20" rx="4" fill="url(#grayGrad)"/>
  <text x="540" y="506" text-anchor="end" class="value">10</text>
  <text x="545" y="506" class="unit">ops/s</text>
  <text x="636" y="506" text-anchor="end" class="ratio">33.34x</text>

  <text x="120" y="536" text-anchor="end" class="label">micromark</text>
  <rect x="130" y="522" width="4" height="20" rx="4" fill="url(#grayGrad)"/>
  <text x="540" y="536" text-anchor="end" class="value">1</text>
  <text x="545" y="536" class="unit">ops/s</text>
  <text x="636" y="536" text-anchor="end" class="ratio">253x</text>

  <text x="120" y="566" text-anchor="end" class="label">remark</text>
  <rect x="130" y="552" width="4" height="20" rx="4" fill="url(#grayGrad)"/>
  <text x="540" y="566" text-anchor="end" class="value">1</text>
  <text x="545" y="566" class="unit">ops/s</text>
  <text x="636" y="566" text-anchor="end" class="ratio">468x</text>

  <text x="325" y="596" text-anchor="middle" class="unit">Higher is better. Ratio shows how much slower vs ox-content.</text>
</svg>
