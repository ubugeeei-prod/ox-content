<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 488">
  <defs>
    <linearGradient id="oxGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7a5cff"/>
      <stop offset="100%" style="stop-color:#4acdff"/>
    </linearGradient>
    <linearGradient id="grayGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4f607b"/>
      <stop offset="100%" style="stop-color:#8190b0"/>
    </linearGradient>
  </defs>

  <style>
    .title { font: bold 14px IBM Plex Sans, system-ui, sans-serif; fill: #131a30; }
    .label { font: 12px IBM Plex Sans, system-ui, sans-serif; fill: #4f607b; }
    .value { font: bold 11px IBM Plex Sans, system-ui, sans-serif; fill: #131a30; }
    .unit { font: 10px IBM Plex Sans, system-ui, sans-serif; fill: #8190b0; }
    .ratio { font: bold 10px IBM Plex Sans, system-ui, sans-serif; fill: #364462; }
  </style>

  <rect width="650" height="488" fill="#f5f7fb" rx="8"/>

  <text x="325" y="24" text-anchor="middle" class="title">Parse + Render Speed (Huge 1.02 MB)</text>

  <text x="120" y="56" text-anchor="end" class="label">ox-content (native)</text>
  <rect x="130" y="42" width="300" height="20" rx="4" fill="url(#oxGrad)"/>
  <text x="540" y="56" text-anchor="end" class="value">218</text>
  <text x="545" y="56" class="unit">ops/s</text>
  <text x="636" y="56" text-anchor="end" class="ratio">1.00x</text>

  <text x="120" y="86" text-anchor="end" class="label">pulldown-cmark + push_html</text>
  <rect x="130" y="72" width="276" height="20" rx="4" fill="url(#grayGrad)"/>
  <text x="540" y="86" text-anchor="end" class="value">201</text>
  <text x="545" y="86" class="unit">ops/s</text>
  <text x="636" y="86" text-anchor="end" class="ratio">1.09x</text>

  <text x="120" y="116" text-anchor="end" class="label">@ox-content/napi</text>
  <rect x="130" y="102" width="265" height="20" rx="4" fill="url(#oxGrad)"/>
  <text x="540" y="116" text-anchor="end" class="value">193</text>
  <text x="545" y="116" class="unit">ops/s</text>
  <text x="636" y="116" text-anchor="end" class="ratio">1.13x</text>

  <text x="120" y="146" text-anchor="end" class="label">md4x (napi)</text>
  <rect x="130" y="132" width="215" height="20" rx="4" fill="url(#grayGrad)"/>
  <text x="540" y="146" text-anchor="end" class="value">156</text>
  <text x="545" y="146" class="unit">ops/s</text>
  <text x="636" y="146" text-anchor="end" class="ratio">1.40x</text>

  <text x="120" y="176" text-anchor="end" class="label">Bun.markdown.html</text>
  <rect x="130" y="162" width="192" height="20" rx="4" fill="url(#grayGrad)"/>
  <text x="540" y="176" text-anchor="end" class="value">140</text>
  <text x="545" y="176" class="unit">ops/s</text>
  <text x="636" y="176" text-anchor="end" class="ratio">1.56x</text>

  <text x="120" y="206" text-anchor="end" class="label">md4w (md4c)</text>
  <rect x="130" y="192" width="148" height="20" rx="4" fill="url(#grayGrad)"/>
  <text x="540" y="206" text-anchor="end" class="value">108</text>
  <text x="545" y="206" class="unit">ops/s</text>
  <text x="636" y="206" text-anchor="end" class="ratio">2.02x</text>

  <text x="120" y="236" text-anchor="end" class="label">satteri</text>
  <rect x="130" y="222" width="100" height="20" rx="4" fill="url(#grayGrad)"/>
  <text x="540" y="236" text-anchor="end" class="value">73</text>
  <text x="545" y="236" class="unit">ops/s</text>
  <text x="636" y="236" text-anchor="end" class="ratio">3.01x</text>

  <text x="120" y="266" text-anchor="end" class="label">markdown-it-ts</text>
  <rect x="130" y="252" width="25" height="20" rx="4" fill="url(#grayGrad)"/>
  <text x="540" y="266" text-anchor="end" class="value">18</text>
  <text x="545" y="266" class="unit">ops/s</text>
  <text x="636" y="266" text-anchor="end" class="ratio">11.80x</text>

  <text x="120" y="296" text-anchor="end" class="label">@tanstack/markdown</text>
  <rect x="130" y="282" width="24" height="20" rx="4" fill="url(#grayGrad)"/>
  <text x="540" y="296" text-anchor="end" class="value">17</text>
  <text x="545" y="296" class="unit">ops/s</text>
  <text x="636" y="296" text-anchor="end" class="ratio">12.50x</text>

  <text x="120" y="326" text-anchor="end" class="label">markdown-it</text>
  <rect x="130" y="312" width="23" height="20" rx="4" fill="url(#grayGrad)"/>
  <text x="540" y="326" text-anchor="end" class="value">17</text>
  <text x="545" y="326" class="unit">ops/s</text>
  <text x="636" y="326" text-anchor="end" class="ratio">12.83x</text>

  <text x="120" y="356" text-anchor="end" class="label">marked</text>
  <rect x="130" y="342" width="22" height="20" rx="4" fill="url(#grayGrad)"/>
  <text x="540" y="356" text-anchor="end" class="value">16</text>
  <text x="545" y="356" class="unit">ops/s</text>
  <text x="636" y="356" text-anchor="end" class="ratio">13.64x</text>

  <text x="120" y="386" text-anchor="end" class="label">@mizchi/markdown</text>
  <rect x="130" y="372" width="17" height="20" rx="4" fill="url(#grayGrad)"/>
  <text x="540" y="386" text-anchor="end" class="value">12</text>
  <text x="545" y="386" class="unit">ops/s</text>
  <text x="636" y="386" text-anchor="end" class="ratio">17.77x</text>

  <text x="120" y="416" text-anchor="end" class="label">micromark</text>
  <rect x="130" y="402" width="4" height="20" rx="4" fill="url(#grayGrad)"/>
  <text x="540" y="416" text-anchor="end" class="value">1</text>
  <text x="545" y="416" class="unit">ops/s</text>
  <text x="636" y="416" text-anchor="end" class="ratio">167x</text>

  <text x="120" y="446" text-anchor="end" class="label">remark</text>
  <rect x="130" y="432" width="4" height="20" rx="4" fill="url(#grayGrad)"/>
  <text x="540" y="446" text-anchor="end" class="value">1</text>
  <text x="545" y="446" class="unit">ops/s</text>
  <text x="636" y="446" text-anchor="end" class="ratio">380x</text>

  <text x="325" y="476" text-anchor="middle" class="unit">Higher is better. Ratio shows how much slower vs ox-content.</text>
</svg>
